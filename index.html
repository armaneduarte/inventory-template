<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Dee Lab - Inventory Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Loaded from CDN for standalone HTML functionality) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Compiles JSX inside the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js for Inventory Data Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JsBarcode for visual barcode generation (Code 128) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        /* Print Specific Styles to hide menus and format for A4 */
        @media print {
            body { background-color: white !important; }
            .print-hide { display: none !important; }
            .print-expand { 
                width: 100% !important; 
                max-width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                border: none !important; 
                box-shadow: none !important; 
            }
            .print-text-black { color: black !important; }
            .print-border { border: 1px solid #e5e7eb !important; }
            .print-page-break { page-break-inside: avoid; }
            @page { margin: 1cm; size: A4 portrait; }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- React Root DOM Node -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- INVENTORY CHART COMPONENT ---
        function InventoryChart({ inventory }) {
            const canvasRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                
                const categories = ['PLA', 'PETG', 'ABS/ASA', 'TPU', 'Resin', 'Hardware', 'Other'];
                
                // Separate counts for active stock vs damaged, and exclude damaged from value
                const counts = categories.map(cat => inventory.filter(i => i.category === cat && i.status !== 'Damaged').length);
                const damagedCounts = categories.map(cat => inventory.filter(i => i.category === cat && i.status === 'Damaged').length);
                const values = categories.map(cat => inventory.filter(i => i.category === cat && i.status !== 'Damaged').reduce((sum, item) => sum + (item.cost * (item.totalAmount > 0 ? item.remainingAmount/item.totalAmount : 0)), 0));

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = canvasRef.current.getContext('2d');
                
                // Create Modern 3D-like Gradients inspired by the image
                const yellowGradient = ctx.createLinearGradient(0, 0, 0, 300);
                yellowGradient.addColorStop(0, '#FDE047'); // Shiny top highlight
                yellowGradient.addColorStop(1, '#D97706'); // Deep amber bottom

                const orangeGradient = ctx.createLinearGradient(0, 0, 0, 300);
                orangeGradient.addColorStop(0, '#FB923C'); // Shiny top highlight
                orangeGradient.addColorStop(1, '#C2410C'); // Deep orange bottom

                const grayGradient = ctx.createLinearGradient(0, 0, 0, 300);
                grayGradient.addColorStop(0, '#CBD5E1'); // Shiny slate top
                grayGradient.addColorStop(1, '#475569'); // Deep slate bottom

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: categories,
                        datasets: [
                            {
                                label: 'Items in Stock',
                                data: counts,
                                backgroundColor: yellowGradient,
                                borderRadius: 12,
                                borderSkipped: false,
                                barPercentage: 0.6,
                                categoryPercentage: 0.8,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Damaged Items',
                                data: damagedCounts,
                                backgroundColor: grayGradient,
                                borderRadius: 12,
                                borderSkipped: false,
                                barPercentage: 0.6,
                                categoryPercentage: 0.8,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Est. Value (₱)',
                                data: values,
                                backgroundColor: orangeGradient,
                                borderRadius: 12,
                                borderSkipped: false,
                                barPercentage: 0.6,
                                categoryPercentage: 0.8,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: { 
                            legend: { 
                                position: 'top',
                                labels: { usePointStyle: true, padding: 20, font: { weight: 'bold' } }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                padding: 12,
                                titleFont: { size: 14 },
                                cornerRadius: 8
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { font: { weight: '600', color: '#475569' } }
                            },
                            y: { 
                                type: 'linear', display: true, position: 'left', 
                                title: { display: true, text: 'Item Count', font: { weight: 'bold' } }, 
                                beginAtZero: true,
                                grid: { color: '#f1f5f9' },
                                border: { display: false }
                            },
                            y1: { 
                                type: 'linear', display: true, position: 'right', 
                                title: { display: true, text: 'Value (₱)', font: { weight: 'bold' } }, 
                                beginAtZero: true,
                                grid: { drawOnChartArea: false },
                                border: { display: false }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [inventory]);

            return (
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mt-6 print-hide">
                    <h3 className="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                        <span className="bg-orange-100 text-orange-600 p-2 rounded-lg leading-none"><i className="fa-solid fa-chart-simple"></i></span>
                        Inventory Overview
                    </h3>
                    <div className="w-full h-72">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        function App() {
            // --- STATE MANAGEMENT ---
            const [inventory, setInventory] = useState(() => {
                try {
                    const saved = localStorage.getItem('tdl_inventory_data_v5'); // Version bumped for fresh start
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return parsed.map(item => ({ ...item, rating: item.rating || 0, history: item.history || [], enableReorderAlert: item.enableReorderAlert !== false }));
                    }
                    
                    return []; // Fresh data array, 0 items by default
                } catch (e) {
                    return [];
                }
            });

            const defaultFormState = {
                id: null,
                category: 'Hardware',
                customCategory: '',
                sku: '',
                supplier: '',
                brand: '',
                itemName: '',
                description: '',
                location: '',
                totalAmount: 1,
                remainingAmount: 1,
                reorderLevel: 1,
                enableReorderAlert: true, // Stock alert Stop/Go control
                unitType: 'pcs',
                status: 'Auto',
                cost: 0,
                retailPrice: 0,
                imageUrl: '',
                rating: 0,
                lastUpdated: new Date().toISOString()
            };

            const [formData, setFormData] = useState(defaultFormState);
            const [isEditing, setIsEditing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('All');
            const [filterStatus, setFilterStatus] = useState('All');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [historyModalItem, setHistoryModalItem] = useState(null); // Controls History Modal

            // --- BARCODE SCANNER STATE ---
            const [isScannerActive, setIsScannerActive] = useState(false);
            const [scanFeedback, setScanFeedback] = useState(''); // Success message after scan

            // --- AUTH STATE (Login Security) ---
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState('');
            const [loginError, setLoginError] = useState('');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });

            // Live Clock Update
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Save to local storage on change
            useEffect(() => {
                localStorage.setItem('tdl_inventory_data_v5', JSON.stringify(inventory));
            }, [inventory]);

            // Check for existing login session on app load (persists across refreshes)
            useEffect(() => {
                const loggedInFlag = localStorage.getItem('tdl_is_logged_in') === 'true';
                const savedUser = localStorage.getItem('tdl_current_user') || '';
                if (loggedInFlag && savedUser) {
                    setIsLoggedIn(true);
                    setCurrentUser(savedUser);
                }
            }, []);

            // --- BARCODE SCANNER (Keyboard emulation support) ---
            // Many cheap barcode scanners act as keyboards and type very fast + Enter.
            const barcodeBufferRef = useRef('');
            const lastKeyTimeRef = useRef(0);

            useEffect(() => {
                if (!isLoggedIn) return;

                const handleKeyDown = (e) => {
                    const now = Date.now();
                    const timeSinceLastKey = now - lastKeyTimeRef.current;

                    // Reset buffer if typing is slow (normal human typing) or too much time passed
                    if (timeSinceLastKey > 80 && barcodeBufferRef.current.length > 0) {
                        barcodeBufferRef.current = '';
                    }

                    if (e.key.length === 1) {
                        // Printable character - add to buffer
                        barcodeBufferRef.current += e.key;
                    } else if (e.key === 'Enter' && barcodeBufferRef.current.length >= 4) {
                        // Likely a barcode scan (long code + fast Enter from scanner)
                        const scannedCode = barcodeBufferRef.current.trim().toUpperCase();

                        // Only apply if it looks like a real barcode (not short normal input)
                        if (scannedCode.length >= 4) {
                            setFormData(prev => ({ ...prev, sku: scannedCode }));
                            
                            // Nice visual feedback
                            setScanFeedback(`✓ Scanned: ${scannedCode}`);
                            setTimeout(() => setScanFeedback(''), 2200);

                            // Optional: flash the SKU input green briefly
                            const skuInput = document.querySelector('input[name="sku"]');
                            if (skuInput) {
                                skuInput.style.transition = 'all 0.2s';
                                skuInput.style.boxShadow = '0 0 0 3px rgb(52 211 153 / 0.5)';
                                setTimeout(() => {
                                    if (skuInput) skuInput.style.boxShadow = '';
                                }, 600);
                            }

                            // If scanner mode was manually activated, turn it off after successful scan
                            if (isScannerActive) {
                                setIsScannerActive(false);
                            }
                        }
                        barcodeBufferRef.current = '';
                    }

                    lastKeyTimeRef.current = now;
                };

                document.addEventListener('keydown', handleKeyDown);
                return () => document.removeEventListener('keydown', handleKeyDown);
            }, [isLoggedIn, isScannerActive, setFormData]);

            // --- VISUAL BARCODE GENERATION (after SKU is set) ---
            const barcodeSvgRef = useRef(null);

            useEffect(() => {
                if (formData.sku && barcodeSvgRef.current && window.JsBarcode) {
                    try {
                        JsBarcode(barcodeSvgRef.current, formData.sku, {
                            format: "CODE128",
                            width: 2.2,
                            height: 55,
                            displayValue: true,
                            fontSize: 13,
                            margin: 8,
                            background: "#ffffff",
                            lineColor: "#1e2937"
                        });
                    } catch (err) {
                        // If SKU has unsupported characters, hide or show fallback
                        if (barcodeSvgRef.current) {
                            barcodeSvgRef.current.style.display = 'none';
                        }
                    }
                }
            }, [formData.sku]);

            // --- SKU GENERATOR (Category-based sequential) ---
            const getCategoryPrefix = (category, customCategory) => {
                if (category === 'Other') {
                    if (customCategory && customCategory.trim()) {
                        const cleaned = customCategory.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
                        return cleaned.slice(0, 5) || 'CUST';
                    }
                    return 'CUST';
                }
                const prefixMap = {
                    'PLA': 'PLA',
                    'PETG': 'PETG',
                    'ABS/ASA': 'ABS',
                    'TPU': 'TPU',
                    'Resin': 'RES',
                    'Hardware': 'HW'
                };
                return prefixMap[category] || 'GEN';
            };

            const generateAutoSKU = (category, customCategory, currentInventory) => {
                const prefix = getCategoryPrefix(category, customCategory);
                // Match existing SKUs like "PLA-001", "RES-042", "CUST-007" (flexible number of digits)
                const regex = new RegExp(`^${prefix}-(\\d+)$`);
                const existingNums = currentInventory
                    .filter(item => item.sku && regex.test(item.sku))
                    .map(item => parseInt(item.sku.match(regex)[1], 10));
                const maxNum = existingNums.length > 0 ? Math.max(...existingNums) : 0;
                const nextNum = maxNum + 1;
                return `${prefix}-${String(nextNum).padStart(3, '0')}`;
            };

            const isSkuUnique = (skuToCheck, excludeId = null) => {
                if (!skuToCheck || !skuToCheck.trim()) return true;
                const normalized = skuToCheck.trim().toUpperCase();
                return !inventory.some(item => 
                    item.sku && item.sku.toUpperCase() === normalized && item.id !== excludeId
                );
            };

            // --- LOGIC & HANDLERS ---
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                let processedValue = value;
                if (name === 'sku') {
                    processedValue = value.toUpperCase().trim();
                }
                setFormData(prev => ({ ...prev, [name]: processedValue }));
            };

            const toggleBarcodeScanner = () => {
                const newState = !isScannerActive;
                setIsScannerActive(newState);
                
                if (newState) {
                    // Focus the SKU input when activating scanner
                    setTimeout(() => {
                        const skuInput = document.querySelector('input[name="sku"]');
                        if (skuInput) skuInput.focus();
                    }, 100);
                    setScanFeedback('Scanner active — Scan barcode with your device now');
                    setTimeout(() => setScanFeedback(''), 1800);
                } else {
                    setScanFeedback('');
                }
            };

            // Download current barcode as PNG
            const downloadBarcodePNG = () => {
                if (!barcodeSvgRef.current || !formData.sku) return;

                const svg = barcodeSvgRef.current;
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                const svgData = new XMLSerializer().serializeToString(svg);
                const img = new Image();

                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);

                    const link = document.createElement("a");
                    link.download = `barcode_${formData.sku}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                };

                img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
            };

            // Print a clean barcode label (opens print dialog with nice layout)
            const printBarcodeLabel = () => {
                if (!formData.sku) return;

                const printWindow = window.open('', '_blank', 'width=400,height=300');
                const brand = formData.brand || '';
                const itemName = formData.itemName || '';
                const location = formData.location || '';

                printWindow.document.write(`
                    <html>
                    <head>
                        <title>Barcode Label - ${formData.sku}</title>
                        <style>
                            @page { size: 80mm 40mm; margin: 3mm; }
                            body { 
                                font-family: system-ui, -apple-system, sans-serif; 
                                margin: 0; 
                                padding: 8px;
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                height: 100%;
                            }
                            .label {
                                width: 100%;
                                text-align: center;
                            }
                            .sku { 
                                font-size: 11px; 
                                font-weight: 700; 
                                letter-spacing: 1px;
                                margin-bottom: 4px;
                            }
                            .info { 
                                font-size: 9px; 
                                color: #334155; 
                                margin-bottom: 6px;
                                line-height: 1.3;
                            }
                            svg { max-width: 100%; height: auto; }
                        </style>
                    </head>
                    <body>
                        <div class="label">
                            <div class="sku">${formData.sku}</div>
                            ${brand || itemName ? `<div class="info">${brand} ${itemName ? '• ' + itemName : ''}</div>` : ''}
                            ${location ? `<div class="info" style="font-size:8px; color:#64748b;">📍 ${location}</div>` : ''}
                            <div id="print-barcode"></div>
                        </div>
                        <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
                        <script>
                            setTimeout(() => {
                                const container = document.getElementById('print-barcode');
                                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                                container.appendChild(svg);
                                
                                JsBarcode(svg, "${formData.sku}", {
                                    format: "CODE128",
                                    width: 1.8,
                                    height: 45,
                                    displayValue: false,
                                    margin: 4
                                });
                                
                                window.print();
                                setTimeout(() => window.close(), 300);
                            }, 300);
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            };

            const handleSave = (e) => {
                e.preventDefault();
                
                const oldItem = isEditing ? inventory.find(i => i.id === formData.id) : null;
                const historyLog = oldItem ? [...(oldItem.history || [])] : [];
                const newRemaining = parseFloat(formData.remainingAmount) || 0;
                
                // Track In/Out History automatically on save
                if (oldItem && oldItem.remainingAmount !== newRemaining) {
                    const diff = newRemaining - oldItem.remainingAmount;
                    historyLog.push({
                        date: new Date().toISOString(),
                        change: Math.abs(diff),
                        type: diff > 0 ? 'IN' : 'OUT',
                        notes: 'Manual edit update'
                    });
                } else if (!oldItem) {
                    historyLog.push({
                        date: new Date().toISOString(),
                        change: newRemaining,
                        type: 'IN',
                        notes: 'Initial stock added'
                    });
                }

                const newItem = {
                    ...formData,
                    id: isEditing ? formData.id : Date.now().toString(),
                    totalAmount: parseFloat(formData.totalAmount) || 0,
                    remainingAmount: newRemaining,
                    reorderLevel: parseFloat(formData.reorderLevel) || 0,
                    enableReorderAlert: formData.enableReorderAlert,
                    cost: parseFloat(formData.cost) || 0,
                    retailPrice: parseFloat(formData.retailPrice) || 0,
                    rating: parseInt(formData.rating) || 0,
                    history: historyLog,
                    lastUpdated: new Date().toISOString()
                };

                // SKU Uniqueness enforcement (protects against manual duplicates)
                if (newItem.sku && newItem.sku.trim()) {
                    const unique = isSkuUnique(newItem.sku, isEditing ? formData.id : null);
                    if (!unique) {
                        alert(`SKU "${newItem.sku}" is already in use by another item.\n\nPlease edit the SKU or click the GENERATE button to create a unique one.`);
                        return; // Stop save, let user correct
                    }
                }

                if (isEditing) {
                    setInventory(inventory.map(item => item.id === newItem.id ? newItem : item));
                } else {
                    setInventory([newItem, ...inventory]);
                }
                
                handleReset();
            };

            // Quick Stock Adjustment (+/- buttons in table)
            const handleStockAdjust = (item, amount, customNote) => {
                const newRemaining = Math.max(0, item.remainingAmount + amount);
                if (newRemaining === item.remainingAmount) return;

                const diff = newRemaining - item.remainingAmount;
                const historyLog = [...(item.history || [])];
                
                historyLog.push({
                    date: new Date().toISOString(),
                    change: Math.abs(diff),
                    type: diff > 0 ? 'IN' : 'OUT',
                    notes: customNote || (diff > 0 ? 'Quick restock' : 'Quick consumption')
                });

                const updatedItem = {
                    ...item,
                    remainingAmount: newRemaining,
                    history: historyLog,
                    lastUpdated: new Date().toISOString()
                };

                setInventory(inventory.map(i => i.id === item.id ? updatedItem : i));
            };

            const handleEdit = (item) => {
                setFormData(item);
                setIsEditing(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleDelete = (id) => {
                if (window.confirm("Are you sure you want to delete this material?")) {
                    setInventory(inventory.filter(item => item.id !== id));
                    if (formData.id === id) handleReset();
                }
            };

            const handleReset = () => {
                setFormData(defaultFormState);
                setIsEditing(false);
            };

            const handlePrint = () => {
                window.print();
            };

            const handleClearDatabase = () => {
                if (window.confirm("WARNING: This will completely wipe out your entire inventory and history log. Are you sure you want to start fresh?")) {
                    setInventory([]);
                    handleReset();
                }
            };

            // --- AUTH HANDLERS (Login / Logout Security) ---
            const handleLogin = (e) => {
                e.preventDefault();
                
                // Demo credentials - change these for your use case or make dynamic in future
                const VALID_USERNAME = 'admin';
                const VALID_PASSWORD = 'threedee123';
                
                if (loginForm.username.trim() === VALID_USERNAME && loginForm.password === VALID_PASSWORD) {
                    const user = loginForm.username.trim();
                    setIsLoggedIn(true);
                    setCurrentUser(user);
                    localStorage.setItem('tdl_is_logged_in', 'true');
                    localStorage.setItem('tdl_current_user', user);
                    setLoginError('');
                    setLoginForm({ username: '', password: '' });
                } else {
                    setLoginError('Invalid username or password. Please try again.');
                }
            };

            const handleLogout = () => {
                if (window.confirm("Are you sure you want to log out?")) {
                    setIsLoggedIn(false);
                    setCurrentUser('');
                    localStorage.removeItem('tdl_is_logged_in');
                    localStorage.removeItem('tdl_current_user');
                    // Inventory data remains safe in localStorage
                }
            };

            // --- EXPORT TO EXCEL (CSV) ---
            const handleExportExcel = () => {
                const headers = [
                    'Date Updated', 'Category', 'Custom Type', 'SKU/Barcode', 'Supplier', 'Brand/Company', 'Item Name', 'Description', 'Location',
                    'Total Unit Size', 'Remaining Stock', 'Reorder Level', 'Alerts Active', 'Unit Metric', 'Status', 'Unit Cost (PHP)', 'Retail Price (PHP)', 'Est. Total Value (PHP)', 'Performance Rating', 'Image Link'
                ];
                
                const rows = inventory.map(item => {
                    const value = item.totalAmount > 0 ? (item.remainingAmount / item.totalAmount) * item.cost : 0;
                    return [
                        new Date(item.lastUpdated).toLocaleString(),
                        item.category,
                        item.customCategory || 'N/A',
                        item.sku || 'N/A',
                        item.supplier || 'N/A',
                        item.brand,
                        item.itemName,
                        item.description || 'N/A',
                        item.location || 'N/A',
                        item.totalAmount,
                        item.remainingAmount,
                        item.reorderLevel || 0,
                        item.enableReorderAlert !== false ? 'Yes' : 'No',
                        item.unitType,
                        item.status !== 'Auto' ? item.status : 'Auto',
                        item.cost.toFixed(2),
                        (item.retailPrice || 0).toFixed(2),
                        value.toFixed(2),
                        item.rating || 0,
                        item.imageUrl || 'No Image'
                    ];
                });

                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                ].join('\n');

                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', `TDL_Inventory_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- DERIVED DATA ---
            const damagedCount = inventory.filter(item => item.status === 'Damaged').length;

            const filteredInventory = inventory.filter(item => {
                const searchString = (item.sku + ' ' + item.brand + ' ' + item.itemName + ' ' + item.supplier + ' ' + item.category + ' ' + item.location).toLowerCase();

                if (item.status === 'Damaged') return sum;
                const percentLeft = item.totalAmount > 0 ? (item.remainingAmount / item.totalAmount) : 0;

                    if (status === 'Low') return <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 border border-red-200"><i className="fa-solid fa-triangle-exclamation text-[10px]"></i> Low</span>;
                    if (status === 'Reorder') return <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 border border-blue-200"><i className="fa-solid fa-rotate text-[10px]"></i> Reorder</span>;

                if (item.enableReorderAlert === false) {

                                                                            title="Edit & Update Stock"
                                                                        >
                                                                            <i className="fa-solid fa-pen"></i>
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleDelete(item.id)}
                                                                            className={`p-1.5 rounded border border-transparent transition-colors ${isDamaged ? 'text-red-500 hover:bg-red-200 hover:border-red-300' : 'text-red-600 hover:bg-red-50 hover:border-red-200'}`}
                                                                            title="Delete Item"
                                                                        >
                                                                            <i className="fa-solid fa-trash"></i>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    {/* End Table */}
                                </div>

                                {/* Data Chart Overview */}
                                <InventoryChart inventory={inventory} />
                                
                            </div>
                        </div>
                    </main>

                    {/* HISTORY MODAL OVERLAY */}
                    {historyModalItem && (
                        <div className="fixed inset-0 bg-slate-900/60 flex justify-center items-center z-50 p-4 print-hide backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden border border-slate-200">
                                
                                <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <div>
                                        <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                            <i className="fa-solid fa-clock-rotate-left text-blue-600"></i> Stock History Log
                                        </h3>
                                        <p className="text-xs text-slate-500 mt-1 font-medium">{historyModalItem.brand} - {historyModalItem.itemName}</p>
                                    </div>
                                    <button onClick={() => setHistoryModalItem(null)} className="text-slate-400 hover:text-slate-800 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full flex justify-center items-center transition-colors">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                
                                <div className="p-6 overflow-y-auto bg-slate-50/50 flex-1">
                                    {(!historyModalItem.history || historyModalItem.history.length === 0) ? (
                                        <div className="text-center py-8">
                                            <i className="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                                            <p className="text-slate-500 italic font-medium">No history records found for this item.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">
                                            {historyModalItem.history.slice().reverse().map((entry, idx) => (
                                                <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                                                    
                                                    {/* Center Timeline Dot */}
                                                    <div className="flex items-center justify-center w-10 h-10 rounded-full border border-white bg-slate-100 text-slate-500 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                                                        {entry.type === 'IN' ? <i className="fa-solid fa-arrow-down text-green-600 text-sm"></i> : <i className="fa-solid fa-arrow-up text-red-500 text-sm"></i>}
                                                    </div>
                                                    
                                                    {/* Event Card */}
                                                    <div className="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                                        <div className="flex justify-between items-start mb-1">
                                                            <div className={`font-bold text-lg leading-none ${entry.type === 'IN' ? 'text-green-600' : 'text-red-500'}`}>
                                                                {entry.type === 'IN' ? '+' : '-'}{entry.change} <span className="text-xs text-slate-400 font-normal uppercase tracking-wider">{historyModalItem.unitType}</span>
                                                            </div>
                                                            <time className="text-[10px] font-semibold text-slate-400 bg-slate-100 px-2 py-1 rounded">
                                                                {new Date(entry.date).toLocaleDateString()}
                                                            </time>
                                                        </div>
                                                        <p className="text-sm font-medium text-slate-700 mt-2">{entry.notes || (entry.type === 'IN' ? 'Stock Added' : 'Stock Removed')}</p>
                                                        <p className="text-[10px] text-slate-400 mt-1"><i className="fa-regular fa-clock mr-1"></i>{new Date(entry.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
                                                    </div>
                                                    
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            ));
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
